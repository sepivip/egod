<html lang="en">

<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #0a0a0a;
    --fg: #e8e8e8;
    --fg-dim: #555;
    --accent: #7c5bf5;
    --accent-glow: rgba(124, 91, 245, 0.15);
  }

  html { height: 100%; }

  body {
    font-family: 'Space Grotesk', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
    height: 100%;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  canvas#dots {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.3;
  }

  .orb {
    position: fixed;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124, 91, 245, 0.12) 0%, rgba(124, 91, 245, 0.03) 40%, transparent 70%);
    filter: blur(60px);
    pointer-events: none;
    z-index: 1;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: breathe 8s ease-in-out infinite, drift 20s ease-in-out infinite;
  }

  .orb-secondary {
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, rgba(91, 140, 245, 0.08) 0%, transparent 60%);
    filter: blur(80px);
    animation: breathe 10s ease-in-out infinite reverse, drift-reverse 25s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
  }

  @keyframes drift {
    0%, 100% { top: 48%; left: 50%; }
    25% { top: 52%; left: 52%; }
    50% { top: 46%; left: 48%; }
    75% { top: 50%; left: 53%; }
  }

  @keyframes drift-reverse {
    0%, 100% { top: 52%; left: 48%; }
    25% { top: 46%; left: 50%; }
    50% { top: 54%; left: 52%; }
    75% { top: 48%; left: 46%; }
  }

  .scene {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 2rem;
    opacity: 0;
    animation: enter 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
  }

  @keyframes enter {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .name {
    font-size: clamp(2.4rem, 7vw, 5.5rem);
    font-weight: 500;
    letter-spacing: -0.03em;
    line-height: 1.1;
    display: inline-flex;
    align-items: baseline;
    justify-content: center;
    background: linear-gradient(
      135deg,
      var(--fg) 0%,
      rgba(232, 232, 232, 0.7) 50%,
      var(--fg) 100%
    );
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 8s ease-in-out infinite;
    user-select: none;
    white-space: nowrap;
  }

  @keyframes shimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .name-middle {
    display: inline-block;
    max-width: 0;
    overflow: hidden;
    white-space: nowrap;
    position: relative;
    opacity: 0;
    transition: max-width 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                padding 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                opacity 0.35s ease;
  }

  .name-middle.revealed {
    max-width: 4.5ch;
    opacity: 1;
    padding: 0 0.08em;
  }

  .name-middle .char {
    display: inline-block;
    -webkit-text-fill-color: rgba(255, 255, 255, 0.12);
    position: relative;
  }

  .name-middle .char:not(.locked) {
    animation: jitter 0.07s steps(2) infinite;
  }

  .name-middle .char.locked {
    -webkit-text-fill-color: var(--fg);
    animation: char-lock 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes jitter {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-1.5px); }
  }

  @keyframes char-lock {
    0% { transform: scale(1); filter: drop-shadow(0 0 0 transparent); }
    35% { transform: scale(1.2); filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.7)); }
    100% { transform: scale(1); filter: drop-shadow(0 0 0 transparent); }
  }

  .tagline {
    margin-top: 1.2rem;
    font-size: clamp(0.85rem, 1.8vw, 1.05rem);
    font-weight: 300;
    color: var(--fg-dim);
    letter-spacing: 0.06em;
    text-transform: lowercase;
    opacity: 0;
    animation: fade-in 1.5s ease 1.2s forwards;
  }

  @keyframes fade-in {
    to { opacity: 1; }
  }

  .links {
    display: flex;
    gap: 1.5rem;
    margin-top: 3rem;
    opacity: 0;
    animation: fade-in 1.5s ease 1.8s forwards;
  }

  .links a {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    color: var(--fg-dim);
    text-decoration: none;
    border-radius: 50%;
    transition: color 0.4s ease, box-shadow 0.4s ease, transform 0.3s ease;
    position: relative;
  }

  .links a::before {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    background: var(--accent-glow);
    opacity: 0;
    transition: opacity 0.4s ease;
    filter: blur(8px);
  }

  .links a:hover {
    color: var(--fg);
    transform: translateY(-2px);
  }

  .links a:hover::before {
    opacity: 1;
  }

  .links svg {
    width: 20px;
    height: 20px;
    position: relative;
    z-index: 1;
    fill: currentColor;
  }

  /* subtle noise overlay */
  .noise {
    position: fixed;
    inset: 0;
    z-index: 10;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 256px 256px;
  }

  /* vignette */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 50%, var(--bg) 100%);
  }

  @media (max-width: 480px) {
    .links { gap: 1.2rem; margin-top: 2.5rem; }
    .links a { width: 36px; height: 36px; }
    .links svg { width: 18px; height: 18px; }
  }
</style>

<script>
  // Dot grid on canvas
  (() => {
    const canvas = document.getElementById('dots');
    const ctx = canvas.getContext('2d');
    let w, h;
    const spacing = 32;
    const baseRadius = 0.6;
    const color = 'rgba(255,255,255,';

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      w = canvas.width = window.innerWidth * dpr;
      h = canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.scale(dpr, dpr);
    }

    let mx = window.innerWidth / 2;
    let my = window.innerHeight / 2;

    window.addEventListener('mousemove', e => {
      mx = e.clientX;
      my = e.clientY;
    });

    function draw() {
      ctx.clearRect(0, 0, w, h);
      const cols = Math.ceil(window.innerWidth / spacing);
      const rows = Math.ceil(window.innerHeight / spacing);

      for (let i = 0; i <= cols; i++) {
        for (let j = 0; j <= rows; j++) {
          const x = i * spacing;
          const y = j * spacing;
          const dist = Math.hypot(x - mx, y - my);
          const maxDist = 200;
          const influence = Math.max(0, 1 - dist / maxDist);
          const r = baseRadius + influence * 1.4;
          const alpha = 0.12 + influence * 0.35;

          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = color + alpha + ')';
          ctx.fill();
        }
      }
      requestAnimationFrame(draw);
    }

    resize();
    window.addEventListener('resize', resize);
    draw();
  })();

  // Name proximity reveal — "Egod" decrypts when cursor approaches
  (() => {
    const nameEl = document.querySelector('.name');
    const middleEl = document.querySelector('.name-middle');
    const target = middleEl.dataset.text;
    const glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#%&$';
    let state = 'hidden'; // hidden | revealing | shown | hiding

    function distTo(el, x, y) {
      const r = el.getBoundingClientRect();
      const dx = Math.max(r.left - x, 0, x - r.right);
      const dy = Math.max(r.top - y, 0, y - r.bottom);
      return Math.hypot(dx, dy);
    }

    document.addEventListener('mousemove', e => {
      const d = distTo(nameEl, e.clientX, e.clientY);
      if (d < 120 && state === 'hidden') reveal();
      else if (d > 220 && state === 'shown') hide();
    });

    function reveal() {
      state = 'revealing';

      // Build char placeholders
      middleEl.innerHTML = target.split('').map(() =>
        '<span class="char"></span>'
      ).join('');

      // Trigger CSS expansion on next frame
      requestAnimationFrame(() => middleEl.classList.add('revealed'));

      const chars = middleEl.querySelectorAll('.char');
      let resolved = 0;

      chars.forEach((el, i) => {
        const delay = i * 140;
        const scrambleMs = 280;

        setTimeout(() => {
          // Scramble phase
          const iv = setInterval(() => {
            el.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
          }, 40);

          // Lock-in phase
          setTimeout(() => {
            clearInterval(iv);
            el.textContent = target[i];
            el.classList.add('locked');
            if (++resolved === chars.length) state = 'shown';
          }, scrambleMs);
        }, delay);
      });
    }

    function hide() {
      state = 'hiding';
      const chars = middleEl.querySelectorAll('.char');

      // Quick scramble out
      chars.forEach(el => {
        el.classList.remove('locked');
        const iv = setInterval(() => {
          el.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
        }, 30);
        setTimeout(() => { clearInterval(iv); el.textContent = ''; }, 110);
      });

      setTimeout(() => {
        middleEl.classList.remove('revealed');
        setTimeout(() => { middleEl.innerHTML = ''; state = 'hidden'; }, 600);
      }, 120);
    }
  })();

  // Animated favicon + tab title
  (() => {
    const link = document.querySelector('link[rel="icon"]');
    const color = '%23ef4444';
    const symbols = ['✳','✴','✵','✶','✷','✸','✹','✺','✻','✼','❊','❋','❈','❇'];
    let frame = 0;

    function svg(sym) {
      return `data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a0a'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='${color}'>${sym}</text></svg>`;
    }

    setInterval(() => {
      link.href = svg(symbols[frame % symbols.length]);
      frame++;
    }, 150);

    // Tab title — rotating cryptic phrases
    const phrases = [
      'egod.space',
      'building...',
      'moving things...',
      'decrypting...',
      'in the void...',
      'shipping...',
      'egod.space',
      'somewhere else...',
      'not here yet...',
      'loading reality...',
    ];
    const glyphs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#%&.';
    let phraseIdx = 0;

    function scrambleTo(text) {
      const arr = new Array(text.length).fill(' ');
      const locked = new Array(text.length).fill(false);
      let cycles = 0;

      const iv = setInterval(() => {
        let done = true;
        for (let i = 0; i < text.length; i++) {
          if (!locked[i]) {
            if (cycles > 3 + i * 2) {
              arr[i] = text[i];
              locked[i] = true;
            } else {
              arr[i] = glyphs[Math.floor(Math.random() * glyphs.length)];
              done = false;
            }
          }
        }
        document.title = arr.join('');
        cycles++;
        if (done) clearInterval(iv);
      }, 45);
    }

    scrambleTo(phrases[0]);
    setInterval(() => {
      phraseIdx = (phraseIdx + 1) % phrases.length;
      scrambleTo(phrases[phraseIdx]);
    }, 5000);
  })();
</script>
